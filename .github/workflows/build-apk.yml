name: Build MobileI2V APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: android-actions/setup-android@v3

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - uses: actions/upload-artifact@v4
        with:
          name: MobileI2V-APK
          path: src/MobileI2VConsole/bin/Release/net10.0-android/publish/*.apk
